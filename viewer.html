<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证件信息查看</title><style>body{font-family:sans-serif;background:#eef1f5;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}.c{background:#fff;padding:26px 30px;border-radius:14px;box-shadow:0 2px 12px #ccc;max-width:360px;width:86%;text-align:center}p{font-size:17px;word-break:break-all;text-align:left;margin:12px 0}button{width:100%;padding:11px;margin:5px 0;border:0;border-radius:8px;color:#fff;font-size:15px;cursor:pointer}.b1{background:#3b82f6}.b2{background:#22c55e}.b3{background:#ef4444}.e{color:#c00;font-size:14px;text-align:center}</style></head><body><div class="c" id="box"><p>加载中…</p></div><script>function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");return decodeURIComponent(escape(atob(s)))}try{var d=dec(location.hash.slice(1)).split("|");var n=d[0],i=d[1];window._d=[n,i,n+" "+i];document.getElementById("box").innerHTML="<h3>🪪 证件信息</h3>"+"<p>姓名：<b>"+n+"</b></p><p>身份证号：<b>"+i+"</b></p>"+"<button class=b1 onclick=cp(0)>📋 复制姓名</button>"+"<button class=b2 onclick=cp(1)>📋 复制身份证号</button>"+"<button class=b3 onclick=cp(2)>📋 复制全部</button>";}catch(e){document.getElementById("box").innerHTML="<p class=e>链接无效或已损坏</p>"}function cp(k){var t=window._d[k];if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){ok(t)})}else{ok(t)}}function ok(t){alert("✅ 已复制："+t)}</script></body></html>
