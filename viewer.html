<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证件信息查看</title><style>body{font-family:sans-serif;background:#eef1f5;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}.c{background:#fff;padding:26px 30px;border-radius:14px;box-shadow:0 2px 12px #ccc;max-width:360px;width:86%;text-align:center}p{font-size:17px;word-break:break-all;text-align:left;margin:12px 0}button{width:100%;padding:11px;margin:5px 0;border:0;border-radius:8px;color:#fff;font-size:15px;cursor:pointer}.b1{background:#3b82f6}.b2{background:#22c55e}.b3{background:#ef4444}.e{color:#c00;font-size:14px;text-align:center;line-height:1.8}input{width:100%;padding:10px;border:2px solid #e5e7eb;border-radius:8px;font-size:12px;word-break:break-all;box-sizing:border-box;font-family:monospace;margin:8px 0;outline:none}input:focus{border-color:#3b82f6}</style></head><body><div class="c" id="box"><p>加载中…</p></div><script>function pad(s){while(s.length%4)s+="=";return s}function dec(s){s=decodeURIComponent(s.replace(/-/g,"+").replace(/_/g,"/"));return decodeURIComponent(escape(atob(pad(s))))}function getData(){var m=location.search.match(/[?&]d=([^&]+)/);if(m)return m[1];if(location.hash&&location.hash.length>1)return location.hash.slice(1);return ""}function show(n,i){window._d=[n,i,n+" "+i];document.getElementById("box").innerHTML="<h3>🪪 证件信息</h3>"+"<p>姓名：<b>"+n+"<\/b><\/p><p>身份证号：<b>"+i+"<\/b><\/p>"+"<button class=b1 onclick=cp(0)>📋 复制姓名<\/button>"+"<button class=b2 onclick=cp(1)>📋 复制身份证号<\/button>"+"<button class=b3 onclick=cp(2)>📋 复制全部<\/button>";}function fail(){document.getElementById("box").innerHTML="<p class=e>⚠️ 链接数据缺失或损坏<br>可能是转发过程中被截断<br><\/p>"+"<input id=fix placeholder=请粘贴完整分享链接><\/input>"+"<button class=b1 onclick=fixIt()>恢复显示<\/button>";}function fixIt(){var u=document.getElementById("fix").value.trim();var m=u.match(/[?&]d=([^&#]+)/);var h=u.match(/#(.+)$/);var s=m?m[1]:(h?h[1]:"");if(!s){alert("链接中没有找到数据");return}try{var d=dec(s).split("|");show(d[0],d[1]);}catch(e){alert("数据仍不完整，请重新索取链接")}}var raw=getData();if(!raw){fail()}else{try{var d=dec(raw).split("|");if(d.length<2||!d[0]||!d[1])throw 0;show(d[0],d[1]);}catch(e){fail()}}function cp(k){var t=window._d[k];if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){ok(t)})}else{ok(t)}}function ok(t){alert("✅ 已复制："+t)}</script></body></html>
